# =============================================================================
# Nginx Host Configuration - Reverse Proxy to Docker Stack
# Save this file to: /etc/nginx/sites-available/foodai
# Then link it: sudo ln -sf /etc/nginx/sites-available/foodai /etc/nginx/sites-enabled/
# =============================================================================

# HTTP Server - Listens on port 80 for the specific domain names
server {
    listen 80;
    listen [::]:80;
    server_name m4nfood.site www.m4nfood.site;

    # Set client request body size to allow media uploads (menu item images, etc.)
    client_max_body_size 50M;

    # Forward all traffic to the Unified Nginx Frontend Docker container (running on port 8080)
    location / {
        proxy_pass http://127.0.0.1:8080;
        
        # Proxy Headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
