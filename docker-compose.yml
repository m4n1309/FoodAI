version: '3.8'

services:
  # 1. MySQL Database Service
  db:
    image: mysql:8.0
    container_name: foodai-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-foodai}
      MYSQL_USER: ${DB_USER:-foodai}
      MYSQL_PASSWORD: ${DB_PASSWORD:-foodaipassword}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER:-foodai}", "-p${DB_PASSWORD:-foodaipassword}"]
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - foodai-network

  # 2. Python AI RAG Service (FastAPI)
  python-rag:
    build:
      context: ./BE/python_rag_service
      dockerfile: Dockerfile
    container_name: foodai-rag
    restart: unless-stopped
    expose:
      - "8001"
    ports:
      - "8001:8001"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER:-foodai}
      - DB_PASSWORD=${DB_PASSWORD:-foodaipassword}
      - DB_NAME=${DB_NAME:-foodai}
      - RAG_PORT=8001
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - foodai-network

  # 3. Node.js Express Backend
  backend:
    build:
      context: ./BE
      dockerfile: Dockerfile
    container_name: foodai-backend
    restart: unless-stopped
    expose:
      - "3000"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER:-foodai}
      - DB_PASSWORD=${DB_PASSWORD:-foodaipassword}
      - DB_NAME=${DB_NAME:-foodai}
      - VECTOR_SERVICE_URL=http://python-rag:8001
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost}
      - JWT_SECRET=${JWT_SECRET:-jwt_super_secret_key_123}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-jwt_refresh_super_secret_key_456}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_CLIENT_ID=${EMAIL_CLIENT_ID}
      - EMAIL_CLIENT_SECRET=${EMAIL_CLIENT_SECRET}
      - EMAIL_REFRESH_TOKEN=${EMAIL_REFRESH_TOKEN}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_PASS=${EMAIL_PASS}
      - SEPAY_WEBHOOK_TOKEN=${SEPAY_WEBHOOK_TOKEN}
      - SEPAY_ACCOUNT_NO=${SEPAY_ACCOUNT_NO}
      - SEPAY_BANK=${SEPAY_BANK}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadminpassword}
      - MINIO_EXTERNAL_URL=${MINIO_EXTERNAL_URL:-http://localhost:9000}
    depends_on:
      db:
        condition: service_healthy
      python-rag:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - foodai-network

  # 4. Frontend Web Server (React Static + Nginx Reverse Proxy)
  frontend:
    build:
      context: ./FE
      dockerfile: Dockerfile
    container_name: foodai-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=/api
      - VITE_APP_NAME=${VITE_APP_NAME:-m4nFood}
      - VITE_SEPAY_ACCOUNT_NO=${SEPAY_ACCOUNT_NO}
      - VITE_SEPAY_BANK=${SEPAY_BANK}
    depends_on:
      - backend
    networks:
      - foodai-network

  # 5. Redis Database Service
  redis:
    image: redis:7.0-alpine
    container_name: foodai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - foodai-network

  # 6. MinIO Object Storage Service
  minio:
    image: minio/minio:latest
    container_name: foodai-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadminpassword}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - foodai-network

volumes:
  db_data:
  redis_data:
  minio_data:

networks:
  foodai-network:
    name: foodai-network
